name: MAX notifier

on:
  pull_request:
    paths:
      - 'max-messenger-notifier/**'
      - 'scripts/max_release.py'
      - 'scripts/test_max_release.py'
      - '.github/workflows/max-notifier.yml'
  workflow_dispatch:
    inputs:
      expected_current_version:
        description: 'Current production-stable version ID (checked before publishing)'
        required: true
        type: string
      rollback_version:
        description: 'Optional: restore this existing version instead of publishing new code'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: max-messenger-notifier/requirements.txt
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r max-messenger-notifier/requirements.txt
      - name: Test notifier without external services
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ru-central1
        run: python -m unittest discover -s max-messenger-notifier -p 'test_*.py' -v
      - name: Test release integrity and guards
        run: python -m unittest discover -s scripts -p 'test_max_release.py' -v
      - name: Build exact source package
        run: python scripts/max_release.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: max-package-${{ github.sha }}
          path: dist/max-notifier/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cf-deploy
    concurrency:
      group: max-production
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: max-package-${{ github.sha }}
          path: dist/max-notifier/
      - name: Publish, check candidate, and move production-stable
        env:
          YC_CF_DEPLOY_SA_ID: ${{ vars.YC_CF_DEPLOY_SA_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CURRENT_VERSION: ${{ inputs.expected_current_version }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: >-
          python scripts/max_release.py deploy
          --expected-current-version "$EXPECTED_CURRENT_VERSION"
          --rollback-version "$ROLLBACK_VERSION"
      - name: Preserve deployment record even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: max-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/max-notifier/
          if-no-files-found: error
          retention-days: 90
      - name: Retain release package and provenance beyond artifact expiry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: max-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" dist/max-notifier/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MAX notifier $RELEASE_TAG" \
            --notes "Deployment record, exact package, and hashes from https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. For rollback runs, deployment.json identifies the restored version; the attached build is the workflow revision." \
            --latest=false
