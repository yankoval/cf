name: Unified storage API tests
on:
  pull_request:
    paths:
      - 'ymq-sig/**'
      - '.github/workflows/unified-storage-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ymq-sig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ymq-sig/package-lock.json
      - run: npm ci
      - run: npm test
